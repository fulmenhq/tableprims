name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Check formatting
        run: make fmt-check
      - name: Run Clippy
        run: make lint
      - name: Check version files
        run: make version-check
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.98.1
      - name: Run tests
        run: cargo test --locked --workspace
      # The Windows runner does not provide GNU Make. The test suite above runs
      # the built binary and checks its exit codes on every platform.
      - name: Run tablebolt smoke
        if: runner.os != 'Windows'
        run: make smoke
  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: ./.github/actions/setup-rust
        with:
          toolchain: 1.88.0
      - name: Run tests
        run: cargo test --locked --workspace
  deny:
    name: License and advisory check
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc@sha256:616a4b5361d2cf7d32ac32496d58e9c288660d5606f0a27efdbf56e3a462ab2d
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Run cargo-deny
        run: cargo deny --locked check
