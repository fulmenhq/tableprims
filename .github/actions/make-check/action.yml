name: make check
description: Install the pinned toolchains, run make check-platform, and require an unchanged tree.
inputs:
  target:
    description: Expected native host triple.
    required: true
  rust-toolchain:
    description: Rust toolchain (the workspace MSRV).
    required: true
  go-toolchain:
    description: Go toolchain for the root Go module.
    required: true
runs:
  using: composite
  steps:
    - name: Install Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.12"
    - name: Install Rust
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # reviewed 2026-08-04 commit
      with:
        toolchain: ${{ inputs.rust-toolchain }}
        components: rustfmt, clippy
    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version: ${{ inputs.go-toolchain }}
        cache: false
    - name: Verify native host and toolchain
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        TOOLCHAIN: ${{ inputs.rust-toolchain }}
        GO_TOOLCHAIN: ${{ inputs.go-toolchain }}
        GOTOOLCHAIN: local
      run: |
        host=$(rustc -vV | awk '/^host:/{print $2}')
        test "${host}" = "${TARGET}"
        rustc --version | grep "^rustc ${TOOLCHAIN} "
        grep -qx "rust-version = \"${TOOLCHAIN}\"" Cargo.toml
        python --version
        go version | grep "^go version go${GO_TOOLCHAIN} "
    - name: Ensure make
      shell: bash
      run: |
        if ! command -v make > /dev/null; then
          echo "make is required on the runner" >&2
          exit 1
        fi
        make --version | head -1
    - name: make check-platform
      shell: bash
      env:
        # Python's default encoding is cp1252 on Windows; keep reads UTF-8 everywhere.
        PYTHONUTF8: "1"
        GITHUB_TOKEN: ""
      run: make check-platform PYTHON=python
    - name: Working tree unchanged by the gate
      shell: bash
      run: |
        git status --porcelain
        test -z "$(git status --porcelain)"
