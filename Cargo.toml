[workspace]
members = ["crates/tableprims", "crates/tableprims-cli", "crates/tableprims-xlsx"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fulmenhq/tableprims"
homepage = "https://github.com/fulmenhq/tableprims"
authors = ["FulmenHQ <fulmenhq@3leaps.net>"]
publish = false

[workspace.dependencies]
tableprims = { version = "=0.1.0", path = "crates/tableprims" }
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde_json = "1"
tableprims-xlsx = { version = "=0.1.0", path = "crates/tableprims-xlsx" }
# Result-file digests, the policy digest and generated run identifiers. Used
# by the CLI only.
sha2 = { version = "0.10", default-features = false, features = ["std"] }
getrandom = { version = "0.4", default-features = false }
canonprims-core = "=0.1.5"
canonprims-json = "=0.1.5"
# The workbook writer is pinned exactly: its number formatting is part of the
# write profile. The `ryu`, `zmij` and `zlib` features stay off.
rust_xlsxwriter = { version = "=0.102.0", default-features = false, features = ["constant_memory"] }
# Test-only readers.
calamine = { version = "=0.38.0", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"
