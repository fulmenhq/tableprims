[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = false
no-default-features = false

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = []

[licenses]
version = 2
unused-allowed-license = "allow"
# Permissive licenses only. Copyleft licenses are not accepted; an unknown
# license fails the check.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "BSD-3-Clause"]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    # Conversion runs offline: no network clients.
    # Bans match exact crate names, so related crates are listed separately.
    { name = "reqwest" },
    { name = "hyper" },
    { name = "hyper-util" },
    { name = "hyper-rustls" },
    { name = "hyper-tls" },
    { name = "ureq" },
    { name = "isahc" },
    { name = "attohttpc" },
    { name = "minreq" },
    { name = "surf" },
    { name = "curl" },
    { name = "curl-sys" },
    { name = "tungstenite" },
    { name = "tokio-tungstenite" },
    { name = "git2" },
    { name = "libgit2-sys" },
    { name = "openssl" },
    { name = "openssl-sys" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
